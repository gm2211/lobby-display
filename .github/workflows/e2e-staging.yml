name: E2E Regression (Staging)

on:
  workflow_run:
    workflows: ["Auto Tag & Deploy Staging"]
    types: [completed]
  schedule:
    - cron: '0 6 * * *'  # Nightly at 6am UTC
  workflow_dispatch:

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Pinned: Playwright only ships browser dependencies for specific Ubuntu releases.
    # ubuntu-latest moved to a release the pinned Playwright does not support, and every
    # run failed at "Install Playwright browsers" before any test ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for staging deploy
        # After a push to main, Render needs a few minutes to build. /api/health answers
        # from the OLD build the whole time, so also wait until /api/version reports the
        # commit that was just deployed (RENDER_GIT_COMMIT, see scripts/render-build.sh).
        # Nightly and manual runs have no expected commit and only wait for health.
        run: |
          echo "Waiting for staging to be ready (expected commit: ${EXPECTED_SHA:-any})..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/api/health" || true)
            HASH=$(curl -s "$E2E_BASE_URL/api/version" | sed -n 's/.*"hash":"\([^"]*\)".*/\1/p' || true)
            if [ "$STATUS" = "200" ] && { [ -z "$EXPECTED_SHA" ] || [ "$HASH" = "$EXPECTED_SHA" ]; }; then
              echo "Staging is ready on ${HASH:-unknown}."
              exit 0
            fi
            echo "Attempt $i/60 - health $STATUS, version ${HASH:-unknown}, retrying in 10s..."
            sleep 10
          done
          echo "Staging did not come up on ${EXPECTED_SHA:-a healthy build} in time (last seen: ${HASH:-unknown})"
          exit 1
        env:
          E2E_BASE_URL: https://seven7-hudson-staging.onrender.com
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          CI: true
          E2E_BASE_URL: https://seven7-hudson-staging.onrender.com
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          E2E_EDITOR_USER: ${{ secrets.E2E_EDITOR_USER }}
          E2E_EDITOR_PASS: ${{ secrets.E2E_EDITOR_PASS }}
          E2E_VIEWER_USER: ${{ secrets.E2E_VIEWER_USER }}
          E2E_VIEWER_PASS: ${{ secrets.E2E_VIEWER_PASS }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/test-results.json
          retention-days: 14
