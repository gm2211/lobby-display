databases:
  - name: hudson-dashboard-db
    plan: basic-256mb
    databaseName: lobby

  # Free plan: Render expires free Postgres after 30 days and later deletes it.
  # When that happens, staging crash-loops (P1001 "Can't reach database server").
  # Recreate it by syncing this Blueprint (Render → Blueprints → Manual sync,
  # or any commit that changes this file), then re-run ./sync-data.sh --apply.
  - name: hudson-dashboard-staging-db
    plan: free
    databaseName: lobby_staging

services:
  # ── Production ──────────────────────────────────────────
  - type: web
    name: 77-hudson-dashboard
    runtime: node
    plan: starter
    branch: deploy/prod
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hudson-dashboard-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECRET
        generateValue: true

  # ── Staging ─────────────────────────────────────────────
  - type: web
    name: 77-hudson-staging
    runtime: node
    plan: free
    branch: deploy/staging
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hudson-dashboard-staging-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECRET
        generateValue: true
